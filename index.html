<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Green Share Final Fix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.1/sdk.js"></script>
    
    <style>
      body { padding: 20px; font-family: 'Kanit', sans-serif; text-align: center; }
      .status-box { background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 20px 0; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <h3>🔧 แก้ไขปัญหาการเชื่อมต่อ</h3>
    
    <div class="status-box">
      <p>สถานะปัจจุบัน:</p>
      <h2 id="status" class="text-primary">⏳ กำลังเริ่มระบบ...</h2>
      <p id="subStatus" class="text-muted small">กรุณารอสักครู่</p>
    </div>

    <div id="fallback" style="display:none;">
      <p class="text-danger">⚠️ ดูเหมือนระบบจะค้าง</p>
      <a href="https://liff.line.me/2008736378-RGBZI6ZX" class="btn btn-warning w-100 mb-2">🔄 ลองกดโหลดใหม่</a>
    </div>

    <script>
      var vConsole = new VConsole(); 
      const MY_LIFF_ID = "2008736378-RGBZI6ZX"; 

      function updateStatus(msg, color) {
        document.getElementById('status').innerText = msg;
        document.getElementById('status').className = color;
      }

      function main() {
        // v2.1 สั่ง liff.init แบบนี้ครับ (ไม่มี await)
        liff.init({
          liffId: MY_LIFF_ID
        }, function (data) {
          // Success Callback
          updateStatus("Init สำเร็จ! (v2.1)", "text-success");
          
          if (!liff.isLoggedIn()) {
             updateStatus("กำลัง Login...", "text-warning");
             liff.login();
             return;
          }
          
          liff.getProfile().then(function (profile) {
            updateStatus("สวัสดีคุณ " + profile.displayName, "text-success");
            alert("ยินดีต้อนรับ: " + profile.displayName);
          });

        }, function (err) {
          // Error Callback
          updateStatus("Error: " + err.code + " " + err.message, "text-danger");
          alert("Error Init: " + err);
        });
      }

      // เริ่มทำงาน
      window.onload = main;
    </script>
  </body>
</html>
